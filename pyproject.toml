[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-tour"
version = "1.0.0"
description = "A constrained traveling salesman problem written as one quantum QUBO, whose optimal tour is the ground state."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.scripts]
road-tour = "road_tour.study:main"

[tool.setuptools.packages.find]
where = ["src"]
